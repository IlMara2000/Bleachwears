<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ink" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f7ab68" />
      <stop offset="0.5" stop-color="#f08a45" />
      <stop offset="1" stop-color="#e2732b" />
    </linearGradient>
    <linearGradient id="ink2" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f6a35e" />
      <stop offset="1" stop-color="#e87c33" />
    </linearGradient>
  </defs>

  <ellipse cx="450" cy="470" rx="235" ry="215" transform="rotate(-8 450 470)"
           fill="none" stroke="#d8d2c6" stroke-width="7" opacity="0.85" />

  <!-- W dietro, sovrapposta in basso a destra -->
  <g transform="translate(630 610) rotate(-3) translate(-630 -610)">
    <text x="630" y="760" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="470"
          font-weight="900" text-anchor="middle" fill="url(#ink2)" stroke="#4a2a1e" stroke-width="24"
          paint-order="stroke" stroke-linejoin="round">W</text>
  </g>

  <!-- B davanti -->
  <g transform="translate(300 450) rotate(-4) translate(-300 -450)">
    <text x="300" y="640" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="500"
          font-weight="900" text-anchor="middle" fill="url(#ink)" stroke="#4a2a1e" stroke-width="24"
          paint-order="stroke" stroke-linejoin="round">B</text>
  </g>

  <!-- colatura crema sul bordo alto-sinistro della B -->
  <g fill="#f4e4c2" stroke="#4a2a1e" stroke-width="16" stroke-linejoin="round">
    <path d="M150 262 C150 224 186 200 228 200 C270 200 306 214 322 238
             C332 254 324 272 306 274 C290 276 276 264 264 270
             C252 278 254 300 246 308 C236 318 220 312 216 296
             C212 280 202 276 190 284 C180 292 182 314 180 344
             C178 382 172 410 164 418 C152 430 134 424 132 406
             C130 384 146 366 150 336 C154 306 148 286 150 262 Z" />
    <ellipse cx="248" cy="352" rx="17" ry="26" />
  </g>

  <!-- schizzi crema a destra della W -->
  <g fill="#f4e4c2" stroke="#4a2a1e" stroke-width="14" stroke-linejoin="round">
    <circle cx="806" cy="352" r="27" />
    <circle cx="862" cy="398" r="18" />
    <circle cx="796" cy="418" r="13" />
  </g>
</svg>
